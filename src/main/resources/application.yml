spring:
  application:
    name: job-application-email-tracker

  datasource:
    # Only the URL has a default value, and it points at the local Docker Compose
    # instance. The username and password have none on purpose: the application fails
    # to start instead of quietly falling back to a hardcoded user.
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations create the whole schema, so there is no older state to baseline over.
    # An empty database must run V1 from the start.
    baseline-on-migrate: false
