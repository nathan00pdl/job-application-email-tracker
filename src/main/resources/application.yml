spring:
  application:
    name: job-application-email-tracker

  datasource:
    # Only the URL has a default value, and it points at the local Docker Compose
    # instance. The username and password have none on purpose: the application fails
    # to start instead of quietly falling back to a hardcoded user.
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` makes Hibernate compare the entities against
      # the real tables at startup and fail if they have drifted apart, which turns a
      # forgotten migration into a startup error instead of a runtime one.
      ddl-auto: validate
    # This application has no web requests, so there is no view to keep a session open
    # for. Turning it off also removes the warning Spring logs about it by default.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations create the whole schema, so there is no older state to baseline over.
    # An empty database must run V1 from the start.
    baseline-on-migrate: false

# Credentials for reading the mailbox. No default values on purpose: a deployment
# missing one fails at startup instead of failing later against Google.
gmail:
  client-id: ${GMAIL_CLIENT_ID}
  client-secret: ${GMAIL_CLIENT_SECRET}
  refresh-token: ${GMAIL_REFRESH_TOKEN}

# The application exists to run the scan, so it does that on startup and then exits.
# Tests turn it off: otherwise every context that boots would try to read a real mailbox.
jobtracker:
  run-on-startup: ${RUN_ON_STARTUP:true}

# The service account key, base64 encoded, and the sheet to write to. Encoding is not
# decoration: the key is JSON with newlines, and one line survives both an .env file read
# by the shell and a value pasted into a secrets form.
#
# The tab name has no default worth guessing — Google names the first tab after the
# account's language, "Sheet1" or "Página1" — so this project asks for an explicit one.
google:
  sheets:
    credentials: ${GOOGLE_SHEETS_CREDENTIALS}
    spreadsheet-id: ${GOOGLE_SHEETS_SPREADSHEET_ID}
    sheet-name: ${GOOGLE_SHEETS_SHEET_NAME:classifications}

