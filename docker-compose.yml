# Database for local development only.
# The application does not run in a container: it runs with Maven on the JVM, both
# locally and inside the GitHub Actions runner in production (see ARCHITECTURE.md).
services:
  postgres:
    # Pinned to an exact patch version, never `latest`, so every machine and every CI
    # run behaves the same way. This should match the major version Neon uses in
    # production.
    image: postgres:17.11-alpine
    container_name: jobtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Listens on this machine only. Nothing else on the network should reach the
      # database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `docker compose up --wait` waits until this passes, so the app never starts
      # while the server is still starting up.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
