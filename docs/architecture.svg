<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 682" width="940" height="682" role="img" aria-labelledby="t d">
<title id="t">Hexagonal architecture of job-application-email-tracker</title>
<desc id="d">The domain and the use case sit inside the hexagon. Four ports sit on its edges. The adapters that implement them sit outside, next to the systems they talk to.</desc>

<rect x="0" y="0" width="940" height="682" fill="#FFFFFF"/>

