name: Daily run

# Runs the pipeline against the real services: reads the mailbox, stores what is about an
# application in the Neon database, mirrors it to the spreadsheet and logs the digest.
#
# Kept apart from ci.yml on purpose. CI answers "is this code correct" on every push; this
# answers "did today's run work" once a day, and each keeps its own history in the Actions
# tab.

on:
  schedule:
    # 09:00 UTC is 06:00 in São Paulo, so the day's news is in before the morning.
    #
    # GitHub runs scheduled workflows on a best-effort basis and delays them at busy hours,
    # sometimes by a lot. That does not cost anything here: each run starts reading from
    # where the last one finished, so a late run simply reads more.
    - cron: "0 9 * * *"
  # By hand, from the Actions tab or `gh workflow run daily-run.yml` — to check a renewed
  # token the same day instead of waiting for tomorrow's schedule.
  workflow_dispatch:
    inputs:
      # Makes the run fail before it touches anything, to check from end to end that a
      # failure reaches you: `gh workflow run daily-run.yml -f fail_on_purpose=true`.
      fail_on_purpose:
        description: Fail on purpose, to check that the failure alert arrives
        type: boolean
        default: false

permissions:
  contents: read

# Never two runs at once. A manual run started while the scheduled one is going would read
# the same emails in parallel, and although the unique constraint keeps the database clean,
# both could append the same rows to the spreadsheet. The second one waits.
concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # A backstop only. The scan step has a shorter limit of its own, because a step that
    # runs out of time fails, and a failure is what the alert job reacts to. A job that runs
    # out of time is cancelled instead, and would go by without an alert.
    timeout-minutes: 30
    outputs:
      cause: ${{ steps.cause.outputs.cause }}

    steps:
      # GitHub hides the value of each secret in the log, but only the value as a whole. A
      # connection error prints the database's host on its own, which is not the whole
      # value of any secret, so it would show in the log — and on a public repository the
      # log is public. This registers the host as one more value to hide, for every step
      # that follows. It comes first so that nothing can print the host before it.
      - name: Hide the database host in the log
        env:
          DATASOURCE_URL: ${{ secrets.DATASOURCE_URL }}
        run: |
          host="${DATASOURCE_URL#*://}"
          host="${host%%[/:?]*}"
          if [ -n "$host" ]; then
            echo "::add-mask::$host"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Fail on purpose
        if: inputs.fail_on_purpose
        run: |
          echo "Failing on purpose, as asked, to check the failure alert."
          exit 1

      # The secrets are handed to this step, not to the whole job: checking out code and
      # installing a JDK have no reason to see a database password. The only other step
      # that sees one is the first, which needs the database URL to hide its host.
      #
      # A failure is not caught anywhere. DailyScanRunner lets it end the process with a
      # non-zero status, Maven turns that into a failed step, and the run shows up as failed
      # — which is what makes a broken day visible instead of a quiet, empty one.
      #
      # The output is also copied to a file, so that the next step can tell why the run
      # failed. `pipefail` keeps the failure: without it, the step would take the status of
      # `tee`, which always succeeds.
      - name: Run the daily scan
        # A normal run reads one day of mail. Reading ninety days, the worst backlog
        # measured, took six minutes. Twenty is far beyond both.
        timeout-minutes: 20
        run: |
          set -o pipefail
          ./mvnw -B spring-boot:run 2>&1 | tee "$RUNNER_TEMP/scan.log"
        env:
          DATASOURCE_URL: ${{ secrets.DATASOURCE_URL }}
          DATASOURCE_USERNAME: ${{ secrets.DATASOURCE_USERNAME }}
          DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}

      # Turns the failure into one word for the alert job. Only that word leaves this job,
      # never a line of the log — the alert job explains why.
      - name: Name the cause
        id: cause
        if: failure()
        env:
          FAILED_ON_PURPOSE: ${{ inputs.fail_on_purpose }}
        run: |
          if [ "$FAILED_ON_PURPOSE" = "true" ]; then
            cause=on-purpose
          elif grep -qs invalid_grant "$RUNNER_TEMP/scan.log"; then
            cause=gmail-token
          else
            cause=unknown
          fi
          echo "cause=$cause" >> "$GITHUB_OUTPUT"

  # Opens an issue when the scan fails, so a broken day reaches you with its cause in the
  # title rather than as a generic "workflow failed" email.
  #
  # A job of its own, so that it alone can write issues. The scan job runs Maven and every
  # library the project pulls in, and none of that code ever holds a token that can write
  # to the repository. This job runs no project code at all; it does not even check it out.
  #
  # The issue carries no text from the log. On a public repository issues are public too,
  # and an error message can hold what the secrets hide in the log, such as the database's
  # host name.
  alert:
    needs: scan
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      # One open issue at a time. While it is open, each new failure is a comment on it, so
      # a week of an expired token is one issue with seven comments, not seven issues. The
      # mention is what makes GitHub notify you, whatever your watch settings.
      - name: Open an issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CAUSE: ${{ needs.scan.outputs.cause }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$CAUSE" in
            gmail-token)
              title="Daily run failed: the Gmail token expired"
              advice="Generate a new refresh token, update the \`GMAIL_REFRESH_TOKEN\` secret, and start a run by hand with \`gh workflow run daily-run.yml\`."
              ;;
            on-purpose)
              title="Daily run failed on purpose, to test this alert"
              advice="Nothing to fix: the run was asked to fail. Close this issue."
              ;;
            *)
              title="Daily run failed"
              advice="The cause is in the run's log."
              ;;
          esac

          body="@$OWNER the daily run failed: $RUN_URL

          $advice

          Nothing is lost while this is open: the next run that succeeds reads from where the last one finished."

          gh label create daily-run-failure --force \
            --color B60205 --description "Opened by the daily run when it fails"

          open=$(gh issue list --label daily-run-failure --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$(printf '**%s**\n\n%s' "$title" "$body")"
          else
            gh issue create --label daily-run-failure --title "$title" --body "$body"
          fi
