name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify

  # Pattern-based static analysis, alongside the build rather than after it: the two
  # jobs are independent, so they run at the same time and neither waits on the other.
  #
  # This answers a different question from CodeQL, which runs in its own workflow.
  # CodeQL follows data through the program and is slower; Semgrep matches shapes in the
  # source and finishes in seconds. They overlap, and each finds things the other misses.
  semgrep:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Findings are uploaded to the Security tab, which is a write. Everything else
      # stays read-only.
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One exact version, read from a file Dependabot keeps current, so a new Semgrep
      # release cannot change what this job does without a pull request saying so.
      #
      # A virtual environment rather than the system Python, which recent Ubuntu images
      # refuse to install into. It lives outside the checkout, so Semgrep does not scan
      # its own installation.
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --requirement .github/semgrep/requirements.txt
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      # Two curated rule sets, named explicitly. `--config auto` would pick them for us,
      # but it needs an account and reports usage back, and neither is wanted here.
      #
      # --error makes a finding fail the job. That is the point of running it on every
      # pull request: a report nobody is forced to read is a report nobody reads. If
      # these rules turn out to be noisy on this codebase, the answer is to narrow them,
      # not to make the job pass regardless.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --sarif --output semgrep.sarif \
            --error

      # Runs even when the step above failed, which is exactly when the findings are
      # worth having somewhere readable.
      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif

